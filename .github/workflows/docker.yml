name: Build and Publish Docker Image
 
on:
  push:
    branches:
      - main
 
permissions:
  contents: read
  packages: write
 
env:
  IMAGE_NAME: devops-flask-postgres
  IMAGE_TAG: 2.0.0
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4
 
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN00 }}
 
      - name: Construir Imagen
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build \
          -t ghcr.io/${REPO}:${{ env.IMAGE_TAG }} \
          -t ghcr.io/${REPO}:latest \
          .

      - name: Publicar Imagen
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/${REPO}:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${REPO}:latest